[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gh0st-runtime"
version = "0.1.0"
description = "Seam-based ephemeral task runtime"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{name = "Matthew Judge", email = "matthew@cyberexperts.org"}]
dependencies = [
  "pydantic>=2,<3",
  "SQLAlchemy>=2,<3",
  "httpx>=0.27,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "websockets>=13,<17",
  "tiktoken>=0.7,<1",
]

[project.scripts]
gh0st = "gh0st.cli:main"

[tool.setuptools.packages.find]
include = ["gh0st*"]

[tool.setuptools.package-data]
gh0st = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
