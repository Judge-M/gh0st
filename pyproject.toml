[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gh0st-core"
version = "0.1.0"
description = "Seam-based ephemeral task runtime"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{name = "Matthew Judge", email = "matthew@cyberexperts.org"}]
dependencies = [
  "pydantic>=2,<3",
  "SQLAlchemy>=2,<3",
  "httpx>=0.27,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "websockets>=13,<17",
  "tiktoken>=0.7,<1",
  "cryptography>=41,<51",
  "qrcode>=8.2,<9",
  "aisuite>=0.2,<0.3",
  "httpx-sse>=0.4,<1",
  "tenacity>=8.2,<10",
  "tokencost>=0.1.26,<0.2",
  "prompt-toolkit>=3,<4",
  "rich>=13,<15",
]

[project.optional-dependencies]
openai = ["aisuite[openai]>=0.2,<0.3"]
anthropic = ["aisuite[anthropic]>=0.2,<0.3"]
google = ["aisuite[google]>=0.2,<0.3"]
ollama = ["aisuite[ollama]>=0.2,<0.3"]
mem0 = ["mem0ai>=0.1,<1"]
pinecone = ["pinecone>=5,<11"]
qdrant = ["qdrant-client>=1.10,<2"]
onepassword = ["onepasswordconnectsdk>=2.1,<3"]

[project.scripts]
gh0st = "gh0st.cli:main"
gh0st-broker = "gh0st.broker:main"
gh0st-relay = "gh0st.relay:main"

[tool.setuptools.packages.find]
include = ["gh0st*"]

[tool.setuptools.package-data]
gh0st = ["static/*.html", "static/web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
