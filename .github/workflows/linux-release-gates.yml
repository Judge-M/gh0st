name: Linux release gates

on:
  push:
    branches: [main, "milestone*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: linux-release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: interfaces/web/gh0st-web/package-lock.json
      - name: Build browser dashboard
        working-directory: interfaces/web/gh0st-web
        run: |
          npm ci
          npm run build:local
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap iproute2 python3-venv util-linux
      - name: Configure bubblewrap for the hosted runner
        run: |
          wrapper_dir="$RUNNER_TEMP/gh0st-bin"
          mkdir -p "$wrapper_dir"
          cat > "$wrapper_dir/bwrap" <<'EOF'
          #!/bin/bash
          set -euo pipefail
          found_userns=0
          found_netns=0
          args=()
          for arg in "$@"; do
            case "$arg" in
              --unshare-user) found_userns=1 ;;
              --unshare-net)
                args+=("--unshare-net" "--share-net")
                found_netns=1
                ;;
              *) args+=("$arg") ;;
            esac
          done
          if [[ "$found_userns" != 1 || "$found_netns" != 1 ]]; then
            echo "bubblewrap command did not request user and network isolation" >&2
            exit 2
          fi
          exec /usr/bin/unshare --user --map-root-user --net --fork \
            /bin/bash -eu -c '
              /usr/sbin/ip link set lo up
              exec {userns_fd}< /proc/self/ns/user
              sandbox_args=()
              for arg in "$@"; do
                if [[ "$arg" == "--" ]]; then
                  sandbox_args+=(--userns "$userns_fd" --cap-drop ALL)
                fi
                sandbox_args+=("$arg")
              done
              exec /usr/bin/bwrap "${sandbox_args[@]}"
            ' gh0st-bwrap "${args[@]}"
          EOF
          chmod +x "$wrapper_dir/bwrap"
          echo "$wrapper_dir" >> "$GITHUB_PATH"
      - name: Install project and test dependencies
        run: |
          /usr/bin/python3 -m venv --copies .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e . pytest
      - name: Run Linux integration tests
        env:
          GH0ST_SANDBOX_RUNTIME: ${{ github.workspace }}/.venv
        run: .venv/bin/python -m pytest -q
      - name: Check admission and router latency
        run: |
          .venv/bin/python -m benchmarks.admission --directory /tmp
          .venv/bin/python -m benchmarks.routing
      - name: Build SDK wheel
        run: .venv/bin/python -m pip wheel . --no-deps --wheel-dir dist
