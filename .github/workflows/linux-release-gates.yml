name: Linux release gates

on:
  push:
    branches: [main, "milestone*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: linux-release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: interfaces/web/gh0st-web/package-lock.json
      - name: Build browser dashboard
        working-directory: interfaces/web/gh0st-web
        run: |
          npm ci
          npm run build:local
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap python3-venv
      - name: Install project and test dependencies
        run: |
          /usr/bin/python3 -m venv --copies /tmp/gh0st-venv
          /tmp/gh0st-venv/bin/python -m pip install --upgrade pip
          /tmp/gh0st-venv/bin/python -m pip install -e . pytest
      - name: Run Linux integration tests
        env:
          GH0ST_SANDBOX_RUNTIME: /tmp/gh0st-venv
        # GitHub's hosted VM denies loopback setup from the runner UID. Root-owned test
        # workspaces match bubblewrap's namespace mapping; gh0st drops worker capabilities.
        run: sudo -n -- env GH0ST_SANDBOX_RUNTIME="$GH0ST_SANDBOX_RUNTIME" /tmp/gh0st-venv/bin/python -m pytest -q
      - name: Check admission and router latency
        run: |
          /tmp/gh0st-venv/bin/python -m benchmarks.admission --directory /tmp
          /tmp/gh0st-venv/bin/python -m benchmarks.routing
      - name: Build SDK wheel
        run: /tmp/gh0st-venv/bin/python -m pip wheel . --no-deps --wheel-dir dist
