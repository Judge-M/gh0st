name: Linux release gates

on:
  push:
    branches: [main, "milestone*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: linux-release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: interfaces/web/gh0st-web/package-lock.json
      - name: Build browser dashboard
        working-directory: interfaces/web/gh0st-web
        run: |
          npm ci
          npm run build:local
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap iproute2 python3-venv
      - name: Configure bubblewrap for the hosted runner
        run: |
          wrapper_dir="$RUNNER_TEMP/gh0st-bin"
          mkdir -p "$wrapper_dir"
          cat > "$wrapper_dir/bwrap" <<'EOF'
          #!/bin/bash
          set -eu
          uid="$(id -u)"
          gid="$(id -g)"
          found_netns=false
          args=()
          for arg in "$@"; do
            args+=("$arg")
            if [[ "$arg" == "--unshare-net" ]]; then
              args+=("--share-net")
              found_netns=true
            fi
          done
          if [[ "$found_netns" != true ]]; then
            echo "bubblewrap command did not request network isolation" >&2
            exit 2
          fi
          namespace="gh0st-ci-$$-$RANDOM"
          cleanup() {
            sudo -n ip netns delete "$namespace" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          sudo -n ip netns add "$namespace"
          sudo -n ip -n "$namespace" link set lo up
          if sudo -n nsenter --net="/run/netns/$namespace" \
            --setgid="$gid" --setuid="$uid" -- /usr/bin/bwrap "${args[@]}"; then
            status=0
          else
            status=$?
          fi
          exit "$status"
          EOF
          chmod +x "$wrapper_dir/bwrap"
          echo "$wrapper_dir" >> "$GITHUB_PATH"
      - name: Install project and test dependencies
        run: |
          /usr/bin/python3 -m venv --copies .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e . pytest
      - name: Run Linux integration tests
        env:
          GH0ST_SANDBOX_RUNTIME: ${{ github.workspace }}/.venv
        run: .venv/bin/python -m pytest -q
      - name: Check admission and router latency
        run: |
          .venv/bin/python -m benchmarks.admission --directory /tmp
          .venv/bin/python -m benchmarks.routing
      - name: Build SDK wheel
        run: .venv/bin/python -m pip wheel . --no-deps --wheel-dir dist
