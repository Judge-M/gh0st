openapi: 3.1.0
info:
  title: gh0st Local Control API
  version: 0.1.0
servers:
  - url: http://127.0.0.1:8383
paths:
  /v1/health:
    get:
      summary: Check local daemon health
      responses:
        '200':
          description: Daemon is running
  /v1/tasks:
    get:
      summary: List recent local tasks
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Tasks, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        task_id: {type: string}
                        description: {type: string}
                        status: {type: string}
                        created_at: {type: string, format: date-time}
                        updated_at: {type: string, format: date-time}
  /v1/run:
    post:
      summary: Route a task and queue its worker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: {type: string, minLength: 1}
                task_id: {type: string}
                source_repo: {type: string, description: Local repository cloned into a task workspace}
                model: {type: string, description: Explicit configured model target override}
                modality:
                  type: string
                  enum: [text, code, vision, image]
                  description: Image generation is disabled unless image is explicitly selected
                image_paths:
                  type: array
                  maxItems: 8
                  items: {type: string, description: Local PNG, JPEG, or WebP file path}
                routing_strategy: {type: string, enum: [smart, cost, quality, speed, local], default: smart}
                max_budget_usd: {type: number, exclusiveMinimum: 0, default: 5}
                max_budget_tokens: {type: integer, minimum: 1, default: 100000}
      responses:
        '202':
          description: Task dispatched
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: {type: string}
                  status: {const: dispatched}
                  ticket_id: {type: string}
                  decision:
                    type: object
                    properties:
                      selected_capability: {type: string}
                      selected_model: {type: string}
                      selected_routing_strategy: {type: string}
                      confidence_score: {type: number}
                      execution_tier: {type: string}
                      compute_placement: {type: string}
                      attached_tool: {type: string}
                      requires_planner: {type: boolean}
  /v1/status:
    get:
      summary: Read task progress and quota
      parameters:
        - name: task_id
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Current task status
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: {type: string}
                  status: {type: string, enum: [active, completed, failed, halted]}
                  quota:
                    type: object
                    properties:
                      tokens_consumed: {type: integer}
                      tokens_reserved: {type: integer}
                      tokens_uncertain: {type: integer}
                      remaining_tokens: {type: integer}
                      cost_usd_consumed: {type: number}
                      cost_usd_reserved: {type: number}
                      cost_usd_uncertain: {type: number}
                      remaining_usd: {type: number}
                  pending_tickets_count: {type: integer}
                  trusted_memory_count: {type: integer}
                  tickets:
                    type: array
                    items:
                      type: object
                      properties:
                        ticket_id: {type: string}
                        status: {type: string}
                        capability: {type: string}
                        report: {type: [object, 'null']}
                  grant_requests:
                    type: array
                    items:
                      type: object
                      properties:
                        grant_id: {type: string}
                        action_type: {type: string}
                        status: {type: string, enum: [pending, approved, rejected]}
                        decided_by: {type: [string, 'null']}
  /v1/grants/{grant_id}/decision:
    post:
      summary: Record an operator decision for a proposed external action
      description: This records approval or rejection; it does not execute the external action.
      parameters:
        - name: grant_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved, operator_id]
              properties:
                approved: {type: boolean}
                operator_id: {type: string, minLength: 1}
      responses:
        '200':
          description: Decision recorded
        '409':
          description: Grant not found or already decided
